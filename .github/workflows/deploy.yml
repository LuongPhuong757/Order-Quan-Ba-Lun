# CI + tự động deploy lên VPS khi có commit vào `main`.
#
# HAI VIỆC, THEO THỨ TỰ — và thứ tự đó là toàn bộ giá trị của file này:
#   1. `ci`     — cài, dựng schema DB thật, typecheck, test, build, gác ngân sách bundle.
#   2. `deploy` — CHỈ chạy khi `ci` xanh, và chỉ với commit trên `main`.
# Deploy không bao giờ chạy song song với `ci` của chính nó: một bản build hỏng không bao giờ
# tới được VPS, vì `needs: ci` chặn ở đó.
#
# VÌ SAO GỌI LẠI ./deploy.sh THAY VÌ VIẾT LẠI LỆNH SSH Ở ĐÂY
# `deploy.sh` là đường deploy tay đang dùng và đã chạy thật nhiều lần (có retry cho fail2ban của
# sshd, có bước `attach-caddy-networks.sh` sau khi build). Chép lại các lệnh đó vào YAML là dựng
# đường deploy THỨ HAI, và hai đường sẽ trôi khỏi nhau — bản ít người chạy hơn (bản tay) sẽ là bản
# sai vào đúng hôm cần deploy gấp.
# Phần workflow này thêm vào so với chạy tay: ĐỢI build trên server xong và đọc mã thoát. `deploy.sh`
# cố ý bung build ở chế độ nền (`nohup`) để terminal của chủ quán không bị treo — nghĩa là nó trả
# về "đã start" chứ không phải "đã xong". CI mà dừng ở đó thì mọi lần deploy đều xanh, kể cả lần
# Docker build gãy.
name: CI + Deploy

on:
  push:
    branches: [main]
  # PR chạy CI nhưng KHÔNG deploy (điều kiện `if` ở job deploy) — để biết nhánh có gãy gì không
  # trước khi merge vào main, chứ không phải phát hiện sau khi nó đã lên production.
  pull_request:
  # Cho phép bấm deploy tay từ tab Actions — cần khi VPS được cài lại mà code không đổi.
  workflow_dispatch:

# Hai lần push liền nhau vào main → deploy xếp hàng, KHÔNG chạy chồng.
# `cancel-in-progress: false` là cố ý: huỷ giữa chừng một lần `docker compose up --build` để lại
# server ở trạng thái nửa vời, tệ hơn nhiều so với việc đợi thêm vài phút.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest

    # Test tích hợp của apps/api nối vào MySQL THẬT (`synchronize: false` ở tầng test — xem
    # `admin-online-orders.integration.test.ts`). Không có service này thì 3 file test tích hợp
    # fail ngay ở beforeAll với đúng câu "Không kết nối được MySQL local".
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: order_quan_balun
          MYSQL_USER: order_app
          MYSQL_PASSWORD: order_app_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # `127.0.0.1` chứ KHÔNG phải `localhost`: với `localhost`, mysql2 đi đường unix socket và
      # runner không có socket nào — lỗi hiện ra là "ECONNREFUSED" khó lần.
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_DATABASE: order_quan_balun
      MYSQL_USER: order_app
      MYSQL_PASSWORD: order_app_pass
      # Giá trị rác CÓ CHỦ ĐÍCH — đây là DB dùng một lần của runner, không phải môi trường thật.
      # Đừng nhét secret production vào job này: nó chạy cả trên PR từ người ngoài.
      JWT_SECRET: ci-only-not-a-real-secret
      IP_HASH_SALT: ci-only-salt
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Cài dependency
        run: pnpm install --frozen-lockfile

      # BUILD ĐỨNG ĐẦU, và thứ tự này là kết quả của lần chạy CI đầu tiên bị đỏ (2026-08-10).
      # `packages/schemas` + `packages/utils` phơi API qua `dist/index.d.ts`, nên trên một checkout
      # SẠCH thì mọi thứ đọc chúng đều hỏng cho tới khi chúng được build: `tsc` của apps/api báo
      # hàng chục `TS2307: Cannot find module '@order/schemas'`, và `schema:verify` (chạy node
      # trực tiếp, không qua turbo) cũng không nạp được entity.
      # Trên máy đã build một lần thì không ai thấy điều này — dist còn lại từ lần trước.
      - name: Build
        run: pnpm build

      # Dựng schema THẬT rồi kiểm lại. Dự án không dùng migration (`synchronize: true`), nên
      # `AppDataSource.initialize()` trong CLI này là thứ tạo bảng; phần verify sau đó truy vấn
      # `information_schema` và exit 1 nếu thiếu cột. Chạy TRƯỚC test vì test tích hợp giả định
      # bảng đã có sẵn.
      - name: Dựng + kiểm schema MySQL
        run: pnpm --filter @order/api schema:verify

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Cửa chắn ngân sách bundle — vượt là FAIL, không phải cảnh báo. Đọc
      # `dist/.vite/manifest.json` nên phải đứng sau `build`.
      - name: Ngân sách bundle
        run: pnpm bundle:budget

  deploy:
    needs: ci
    # 3 điều kiện, thiếu một là không deploy: CI xanh (`needs`), đang ở main, và không phải PR.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Khai `environment` để bật được "Required reviewers" trong Settings → Environments: khi nào
    # muốn chuyển từ tự động sang "phải bấm duyệt mới lên production" thì tick ở đó, KHÔNG cần
    # sửa file này. Cũng là nơi GitHub ghi lại lịch sử từng lần deploy.
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Cài sshpass
        # VPS đang xác thực bằng MẬT KHẨU (xem deploy.sh). Nếu sau này chuyển sang SSH key thì bỏ
        # bước này, đổi `DEPLOY_PASS` thành `DEPLOY_SSH_KEY` và sửa `rssh()` trong deploy.sh —
        # sửa MỘT chỗ, cả deploy tay lẫn CI cùng đổi theo.
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Dựng .env.deploy từ secrets
        # File này gitignored và deploy.sh đọc nó. Dựng ở đây thay vì truyền biến môi trường để
        # workflow chạy ĐÚNG script mà chủ quán chạy tay, không rẽ nhánh riêng.
        run: |
          umask 077
          cat > .env.deploy <<EOF
          DEPLOY_HOST=${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER=${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT=${{ secrets.DEPLOY_PORT }}
          DEPLOY_PASS=${{ secrets.DEPLOY_PASS }}
          DEPLOY_PATH=${{ secrets.DEPLOY_PATH }}
          EOF

      - name: Deploy (git pull + rebuild Docker trên VPS)
        run: ./deploy.sh

      - name: Đợi build trên server xong
        # deploy.sh bung build ở chế độ nền nên bước trên trả về ngay. Không có bước đợi này thì
        # MỌI lần deploy đều xanh, kể cả lần Docker build gãy — CI sẽ nói dối một cách có hệ thống.
        # Chờ tối đa 20 phút: VPS 2 vCPU build 2 frontend + API mất khoảng 6–12 phút.
        timeout-minutes: 22
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            log="$(./deploy.sh --logs || true)"
            if echo "$log" | grep -q "DEPLOY_DONE_EXIT="; then
              code="$(echo "$log" | grep -o 'DEPLOY_DONE_EXIT=[0-9]*' | tail -1 | cut -d= -f2)"
              echo "$log"
              if [ "$code" = "0" ]; then
                echo "✅ Build trên server xong, mã thoát 0"
                exit 0
              fi
              echo "❌ Build trên server thất bại, mã thoát $code"
              exit 1
            fi
            echo "… đang build trên server ($((i * 10))s)"
            sleep 10
          done
          echo "❌ Quá 20 phút chưa thấy DEPLOY_DONE_EXIT — vào VPS xem /tmp/deploy-build.log"
          exit 1

      - name: Kiểm tra site sống
        # Build xong không có nghĩa là site lên: container có thể restart-loop, Caddy có thể chưa
        # lấy được cert. Đây là bước duy nhất hỏi đúng câu khách sẽ hỏi — "trang có mở được không".
        # Bỏ qua nếu chưa khai biến `HEALTH_URL` (Settings → Variables), để workflow dùng được ngay
        # cả khi domain chưa sẵn sàng.
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          if [ -z "${HEALTH_URL:-}" ]; then
            echo "⏭  Chưa khai biến HEALTH_URL — bỏ qua bước kiểm tra site."
            exit 0
          fi
          for i in 1 2 3 4 5 6; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$HEALTH_URL" || true)"
            echo "lần $i: $HEALTH_URL → $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "❌ Site chưa trả 200 sau 6 lần thử. Kiểm tra: ./deploy.sh --status"
          exit 1

      - name: Dọn credentials
        # `if: always()` để file mật khẩu không ở lại trên runner khi một bước trên fail. Runner
        # của GitHub vốn bị huỷ sau mỗi lần chạy, nhưng self-hosted runner thì không — đừng để
        # thói quen này phụ thuộc vào loại runner đang dùng.
        if: always()
        run: rm -f .env.deploy
