<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1: chặn iOS Safari tự zoom khi khách bấm vào ô input (F-16). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <!-- = --brand-600 trong src/styles/tokens.css -->
    <meta name="theme-color" content="#b82a1e" />
    <!-- Icon trang khách = ĐÚNG ảnh logo quán trong public/logo.jpg (cùng ảnh header
         đang hiện), nhúng base64 trong favicon.svg. Khung ngoài: vuông bo góc + viền hổ
         phách, để phân biệt với tab quản trị (tròn + xanh mòng) — chủ quán chốt
         2026-08-05 là giữ nguyên ảnh, chỉ cho khác bo viền ngoài.
         apple-touch-icon là PNG 180px full-bleed (không có vùng trong suốt, kẻo iOS tô
         đen khi khách thêm vào màn hình chính), sinh từ favicon.svg bằng rsvg-convert. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Quán Bà Lùn — Đặt hàng</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
