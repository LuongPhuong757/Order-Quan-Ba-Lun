# Production stack: caddy (HTTPS) → api → mysql, kèm sidecar backup MySQL.
# Triển khai: cp .env.production.example .env.production → sửa secrets →
# docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Hostname (2026-08-05): apex + www = trang khách, admin.<domain> = trang quản lý.
# Cả hai cùng vào api:3001, main.ts chọn bundle theo Host header. Xem Caddyfile.

# Giới hạn log mọi container. Không có cái này, json-file log phình vô hạn và lấp đầy ổ —
# ổ đầy thì mysqldump ghi ra file cụt, tức là mất luôn cả backup đúng lúc cần nó nhất.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.0
    container_name: ordbl_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      # 4GB RAM VPS → cấp 1GB cho innodb buffer pool (cache toàn bộ menu + orders trong RAM)
      - --innodb-buffer-pool-size=1G
      - --max-connections=100
      - --performance-schema=OFF
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    # KHÔNG expose port — chỉ api truy cập qua internal network.
    networks:
      - backend

  # Backup MySQL hằng ngày → ./backups/ordbl-<timestamp>.sql.gz (script: scripts/mysql-backup.sh).
  # Dùng lại image mysql:8.0 đã có sẵn nên không phải pull thêm gì.
  mysql-backup:
    image: mysql:8.0
    container_name: ordbl_mysql_backup
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-20}
      BACKUP_MINUTE: ${BACKUP_MINUTE:-30}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_KEEP_MIN: ${BACKUP_KEEP_MIN:-7}
    # Ghi đè entrypoint của image mysql (nó vốn định khởi động cả một server MySQL).
    entrypoint: ["bash", "/backup.sh"]
    volumes:
      - ./scripts/mysql-backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      mysql:
        condition: service_healthy
    logging: *default-logging
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ordbl_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3001
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_LIFETIME_DAYS: ${JWT_LIFETIME_DAYS:-7}
      COOKIE_NAME: ${COOKIE_NAME:-ssp_token}
      # HTTP mode → cookie secure=false. Khi có HTTPS đổi 'true'.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SETUP_ALLOWED_IP: ${SETUP_ALLOWED_IP:-127.0.0.1}
      # CSRF origin check — set theo public URL của site
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
      # Salt hash IP luồng public (M2.D-56). Bỏ trống = rơi về salt dev mặc định trong code.
      IP_HASH_SALT: ${IP_HASH_SALT:-}
      # SMS + OTP (2026-08-06) — xem .env.production.example để biết từng biến.
      SMS_DRIVER: ${SMS_DRIVER:-console}
      ESMS_API_KEY: ${ESMS_API_KEY:-}
      ESMS_SECRET_KEY: ${ESMS_SECRET_KEY:-}
      ESMS_BRANDNAME: ${ESMS_BRANDNAME:-}
      ESMS_SMS_TYPE: ${ESMS_SMS_TYPE:-2}
      ESMS_SANDBOX: ${ESMS_SANDBOX:-}
      OTP_CHANNEL: ${OTP_CHANNEL:-log}
      OTP_SMS_TEMPLATE: ${OTP_SMS_TEMPLATE:-}
      # Link bí mật cập nhật ảnh món (2026-08-16) — ≥16 ký tự thì /anh-mon/<token> hoạt động,
      # bỏ trống = tính năng tắt hẳn. Xem public-menu-photos.controller.ts.
      MENU_PHOTO_TOKEN: ${MENU_PHOTO_TOKEN:-}
    volumes:
      # Persist menu images (mất container không mất file)
      - ./uploads:/app/apps/api/uploads
    depends_on:
      mysql:
        condition: service_healthy
    logging: *default-logging
    networks:
      - backend
      - frontend
    # KHÔNG expose port — chỉ Caddy proxy.

  caddy:
    image: caddy:2-alpine
    container_name: ordbl_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3 QUIC
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Cấu hình Caddy của các site khác trên cùng VPS (xem cuối Caddyfile).
      # Thư mục này KHÔNG nằm trong git — deploy không bao giờ ghi đè nội dung bên trong.
      - ./caddy-local:/etc/caddy/local:ro
      - caddy_data:/data        # Let's Encrypt certs (persistent — sẵn sàng khi switch HTTPS)
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-}
    depends_on:
      - api
    logging: *default-logging
    networks:
      - frontend

volumes:
  mysql_data:
  caddy_data:
  caddy_config:

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
